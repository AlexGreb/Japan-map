<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Япония · 7–17 октября</title>
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="common.css">
<style>
  html,body{height:100%;overflow:hidden}

  /* ====== каркас ====== */
  #map{position:fixed;top:0;right:0;bottom:0;left:460px;background:#dfe6e2;z-index:1}
  #panel{position:fixed;top:0;left:0;bottom:0;width:460px;display:flex;flex-direction:column;background:var(--bg);
    border-right:1px solid var(--line);z-index:500}
  #tabbar{display:flex;gap:4px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;
    font-size:13px;font-weight:600;color:var(--muted)}
  #tabbar button span{font-size:22px;line-height:1}
  #tabbar button.on{background:var(--accent-soft);color:var(--accent)}
  .grab{display:none}
  #phead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex:none}
  #phead h1{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  #phead .sub{font-size:14px;color:var(--muted)}
  #phead .sp{flex:1}
  .icon-btn{width:44px;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;
    display:flex;align-items:center;justify-content:center;flex:none}
  #chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none;flex:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;height:56px;padding:0 10px;
    border-radius:14px;background:var(--card);box-shadow:var(--shadow);line-height:1.1;position:relative}
  .chip b{font-size:18px;font-weight:800}
  .chip small{font-size:12px;color:var(--muted);font-weight:600}
  .chip.on{background:var(--ink);color:var(--bg)}
  .chip.on small{color:var(--bg);opacity:.75}
  .chip.today::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .chip.all{font-weight:700;font-size:14px;position:sticky;left:0;z-index:2;box-shadow:6px 0 10px -4px rgba(0,0,0,.25),var(--shadow)}
  #body{flex:1;overflow-y:auto;padding:4px 16px 40px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* ====== общие блоки ====== */
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
  .h2{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
  .h3{font-size:18px;font-weight:700;margin-bottom:8px}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .lead{font-size:15px;color:var(--muted);margin:0 2px 14px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--accent);padding:8px 0;margin-bottom:4px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--muted);margin-top:6px}
  .meta b{color:var(--ink);font-weight:700}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--muted)}
  .pill.today{background:var(--accent);color:#fff}
  .hi{background:var(--hi);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:12px}
  .tip{background:var(--tip-bg);color:var(--tip-fg);border-radius:14px;padding:12px 14px;font-size:15px;margin-top:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;
    font-size:16px;font-weight:700;text-decoration:none;background:var(--chip);color:var(--ink)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.block{display:flex;width:100%}
  .btns{display:grid;gap:8px;margin-top:12px}
  .ci{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:21px}
  .ci b{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--ink);color:var(--bg);
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
  .dn{flex:none;width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1}
  .dn b{font-size:20px;font-weight:800}
  .dn small{font-size:11px;font-weight:700;opacity:.75;margin-top:2px}

  /* список дней */
  .dcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
  .dcard .tt{font-size:17px;font-weight:700;line-height:1.3}
  .dcard .go{margin-left:auto;font-size:22px;color:var(--faint)}
  .dcard.today{outline:2.5px solid var(--accent)}

  /* места дня */
  .row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px}
  .row .tx{flex:1;min-width:0}
  .row .tm{font-size:14px;font-weight:700;color:var(--muted)}
  .row .nm{font-size:17px;font-weight:700;line-height:1.3}
  .row .sm{font-size:14px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .go{font-size:22px;color:var(--faint)}
  .mv{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);padding:2px 0 12px 20px;margin-left:2px}
  .mv::before{content:"";width:2px;align-self:stretch;background:repeating-linear-gradient(var(--faint) 0 4px,transparent 4px 8px);margin-right:6px}
  .mv b{color:var(--ink)}
  .hotel{display:flex;gap:12px;align-items:flex-start;background:#1c2026;color:#f2f4f7;border-radius:18px;padding:14px 16px;margin-top:6px}
  .hotel .ic{font-size:26px;line-height:1}
  .hotel .hn{font-weight:700;font-size:16px}
  .hotel .hm{font-size:14px;color:#c9ced6;margin-top:2px}
  .hotel .ja{font-size:15px;margin-top:6px}
  .hotel a{display:inline-block;margin-top:8px;margin-right:16px;color:#ffd27a;font-size:15px;font-weight:700;text-decoration:none}
  .pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .pager button{min-height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px;padding:0 10px}
  .pager button:disabled{opacity:.35;cursor:default}

  /* карточка места */
  .photo{width:100%;height:200px;object-fit:cover;border-radius:18px;display:block;background:var(--chip)}
  .photo-fb{width:100%;height:120px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:52px}
  .stop-h{display:flex;gap:12px;align-items:center;margin-top:14px}
  .stop p{font-size:16px;margin-top:10px}
  .facts{margin-top:12px;display:grid;gap:8px;font-size:15px}
  .facts div{display:flex;gap:10px}
  .facts .k{flex:none;width:24px;text-align:center}
  .facts small{color:var(--faint);font-size:13px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;gap:4px;margin:6px 0 12px}
  .seg button{min-height:42px;border-radius:11px;font-size:15px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .from{font-size:15px;color:var(--muted);margin-bottom:8px}
  .from b{color:var(--ink)}
  .mvtxt{font-size:15px;margin-bottom:10px;padding:10px 12px;border-radius:12px;background:var(--chip)}
  .leg{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;margin:4px 0 4px}
  .leg .ic{font-size:30px}
  .leg small{display:block;font-weight:500;font-size:14px;color:var(--muted)}

  /* план, списки, инфо */
  .day{padding:0;overflow:hidden}
  .dh{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px}
  .dh .chev{margin-left:auto;font-size:18px;color:var(--faint);transition:transform .2s}
  .day.open .dh .chev{transform:rotate(180deg)}
  .db{display:none;padding:0 16px 14px}
  .day.open .db{display:block}
  .it{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .it input,.ck input{flex:none;width:24px;height:24px;accent-color:var(--ok);cursor:pointer;margin-top:2px}
  .it .nm{font-weight:700;font-size:17px;line-height:1.3}
  .it .nt{font-size:15px;color:var(--muted);margin-top:4px}
  .it .lk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .it .lk .btn{min-height:40px;font-size:14px;padding:0 12px}
  .it.move .nm{font-weight:600;font-size:15px}
  .it.done .nm,.it.done .nt{text-decoration:line-through;opacity:.5}
  .progress{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;margin:4px 2px 14px}
  .progress .bar{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--ok);transition:width .3s}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stats div{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;color:var(--muted)}
  .stats b{display:block;font-size:20px;color:var(--ink)}
  .ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:16px;border-top:1px solid var(--line)}
  .ck:first-of-type{border-top:none}
  .ck.done>div,.ck.done>span{opacity:.5}
  .ck.done .t,.ck.done>span{text-decoration:line-through}
  .ck .t{font-weight:700;font-size:17px}
  .ck .w{font-size:14px;font-weight:700;color:var(--accent);margin-top:2px}
  .ck .n{font-size:15px;color:var(--muted);margin-top:4px}
  .ck ul{padding-left:20px;margin-top:4px}
  .ck a{display:inline-block;margin-top:8px;font-weight:700;color:var(--accent);text-decoration:none}
  .segtabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
  .segtabs button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px}
  .segtabs button.on{background:var(--ink);color:var(--bg)}
  .list{padding-left:20px;font-size:16px}
  .list li+li{margin-top:8px}
  .addr{font-size:22px;font-weight:700;line-height:1.4;margin:6px 0}

  /* ====== карта ====== */
  .leaflet-container{font:inherit}
  .mk{position:relative;width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:19px;transition:transform .15s}
  .mk b{position:absolute;top:-7px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#111418;color:#fff;
    font:800 13px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
  .mk.sel{transform:scale(1.3)}
  .mk.dim{opacity:.45}
  .hpin{width:34px;height:34px;border-radius:10px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);background:#1c2026;
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .me{width:18px;height:18px;border-radius:50%;background:#2a7fff;border:3px solid #fff;box-shadow:0 0 0 3px rgba(42,127,255,.35),0 2px 6px rgba(0,0,0,.4)}
  .map-btn{width:44px;height:44px;border-radius:12px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-size:20px;
    display:flex;align-items:center;justify-content:center;border:none!important}
  .legend{background:var(--card);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;font-size:14px;min-width:190px}
  .legend div{display:flex;align-items:center;gap:8px;padding:3px 0}
  .legend .d{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .legend .h{font-weight:700;margin-bottom:4px}
  .leaflet-tooltip.lbl{background:var(--card);color:var(--ink);border:none;box-shadow:0 2px 8px rgba(0,0,0,.25);font-weight:700;font-size:13px;padding:4px 9px;border-radius:8px}
  .leaflet-tooltip.lbl::before{display:none}
  .z-low .leaflet-tooltip.perm{display:none}
  .leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important;background:var(--card)!important;color:var(--ink)!important}

  /* ====== телефон ====== */
  @media (max-width:899px){
    #map{left:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
    #panel{width:100%;border-right:none;top:auto;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));height:52%;
      border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.2);transition:height .3s cubic-bezier(.4,0,.2,1)}
    #panel[data-state="mini"]{height:170px}
    #panel[data-state="full"]{height:calc(100% - 70px - var(--tabh))}
    body:not([data-tab="map"]) #panel{top:0;height:auto;border-radius:0;transition:none}
    body:not([data-tab="map"]) #chips,body:not([data-tab="map"]) .grab{display:none}
    #tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));
      padding:6px 8px env(safe-area-inset-bottom);border-bottom:none;border-top:1px solid var(--line);z-index:600}
    .grab{display:flex;justify-content:center;align-items:center;height:26px;flex:none;cursor:grab;touch-action:none}
    .grab span{width:48px;height:5px;border-radius:3px;background:var(--faint);opacity:.6}
    #phead{padding-top:2px}
    body[data-tab="map"] #phead h1{font-size:19px}
  }
  body:not([data-tab="map"]) #chips{display:none}
  @media print{
    #map,#tabbar,.grab,#chips,.segtabs{display:none!important}
    #panel{position:static;width:auto;height:auto;border:none}
    html,body{overflow:visible;height:auto}
    #body{overflow:visible}
    .db{display:block!important}
  }
</style>
</head>
<body data-tab="map">
<aside id="panel" data-state="peek">
  <nav id="tabbar">
    <button data-t="map"><span>🗺️</span>Карта</button>
    <button data-t="plan"><span>📅</span>План</button>
    <button data-t="lists"><span>✅</span>Списки</button>
    <button data-t="info"><span>📖</span>Инфо</button>
  </nav>
  <div class="grab" id="grab" title="Развернуть / свернуть"><span></span></div>
  <header id="phead">
    <div><h1 id="ptitle">Япония</h1><div class="sub" id="psub"></div></div>
    <div class="sp"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Тема"></button>
  </header>
  <nav id="chips"></nav>
  <div id="body"></div>
</aside>
<div id="map"></div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
const $=id=>document.getElementById(id);
const ext='target="_blank" rel="noopener"';
const mobile=()=>innerWidth<900;
const today=todayDay();
const cat=s=>CATS[s.type]||CATS.city;
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const wd=d=>WD[new Date(d.iso+'T12:00:00+09:00').getUTCDay()];
const dnum=d=>+d.iso.slice(8);

// ---------- подготовка данных ----------
DAYS.forEach(d=>{let k=0;d.stops.forEach((s,i)=>{s.i=i;if(!s.move)s.k=++k;});d.places=d.stops.filter(s=>!s.move);});
const hotelOf=d=>d&&d.hotel&&!HOTELS[d.hotel].tbd?HOTELS[d.hotel]:null;
function prevOf(d,s){ // откуда идём: предыдущее место дня, для первого — отель прошлой ночи
  for(let j=s.i-1;j>=0;j--)if(!d.stops[j].move)return {p:d.stops[j],moves:d.stops.slice(j+1,s.i).filter(x=>x.move)};
  const h=hotelOf(DAYS[d.n-2]);
  return {p:h?Object.assign({hotel:true},h):null,moves:d.stops.slice(0,s.i).filter(x=>x.move)};
}

// ---------- мелочи ----------
function imgFail(el){const d=document.createElement('div');d.className='photo-fb';d.style.background=el.dataset.c;d.textContent=el.dataset.e;el.replaceWith(d);}
function photo(s){const c=cat(s);
  return s.img?`<img class="photo" src="${s.img}" alt="" data-c="${c.color}" data-e="${c.icon}" onerror="imgFail(this)">`
              :`<div class="photo-fb" style="background:${c.color}">${c.icon}</div>`;}
const ciHtml=(s,label)=>`<span class="ci" style="--c:${cat(s).color}">${cat(s).icon}${label!=null?`<b>${label}</b>`:''}</span>`;
const dnHtml=d=>`<span class="dn"><b>${dnum(d)}</b><small>${wd(d)}</small></span>`;
function firstSentence(t){const m=t.match(/^.*?[.!?](\s|$)/);return m?m[0]:t;}
function km(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function fmtMin(sec){const m=Math.max(1,Math.round(sec/60));return m<60?m+' мин':Math.floor(m/60)+' ч'+(m%60?' '+m%60+' мин':'');}
function fmtKm(m){return m<1000?Math.round(m/10)*10+' м':(m/1000).toFixed(1).replace('.',',')+' км';}
function gmDir(from,to){return 'https://www.google.com/maps/dir/?api=1'+(from?'&origin='+from.lat+','+from.lng:'')+'&destination='+to.lat+','+to.lng+'&travelmode=transit';}
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m===1?a:m>1&&m<5?b:c;}

// ================= КАРТА =================
let map=null,allLayer,dayLayer,legLayer,myMarker=null;
function loadLeaflet(srcs,done){
  if(window.L)return done();
  if(!srcs.length){$('map').innerHTML='<div style="padding:40px;text-align:center">Не удалось загрузить карту — обновите страницу.</div>';return;}
  const s=document.createElement('script');s.src=srcs[0];s.onload=done;s.onerror=()=>loadLeaflet(srcs.slice(1),done);document.head.appendChild(s);
}
function mkIcon(s,label,sel){const c=cat(s);return L.divIcon({className:'',
  html:`<div class="mk${sel?' sel':''}" style="--c:${c.color}">${c.icon}${label!=null?`<b>${label}</b>`:''}</div>`,iconSize:[40,40],iconAnchor:[20,20]});}
const hotelIcon=()=>L.divIcon({className:'',html:'<div class="hpin">🏨</div>',iconSize:[34,34],iconAnchor:[17,17]});
const meIcon=()=>L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]});

function initMap(){
  map=L.map('map',{zoomControl:!mobile()}).setView([35.2,137],6);
  if(map.zoomControl)map.zoomControl.setPosition('topright');
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" '+ext+'>Leaflet</a>');
  // локальная основа карты (tiles/, масштабы 4–9) — видна даже без интернета
  L.tileLayer('tiles/{z}/{x}/{y}.png',{maxZoom:19,minNativeZoom:4,maxNativeZoom:9,bounds:[[30,128],[44,146]],attribution:'&copy; OpenStreetMap'}).addTo(map);
  // подробная карта из интернета; если сервер не отвечает — переключаемся на запасной (CARTO требует ключ — не используем)
  const TILES=[['https://tile.openstreetmap.org/{z}/{x}/{y}.png','&copy; OpenStreetMap'],
    ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}','&copy; Esri']];
  let ti=0,err=0,ok=0,tl;
  (function set(i){if(tl)map.removeLayer(tl);err=ok=0;tl=L.tileLayer(TILES[i][0],{maxZoom:19,attribution:TILES[i][1]}).addTo(map);
    tl.on('tileload',()=>ok++);tl.on('tileerror',()=>{if(++err>=4&&!ok&&ti<TILES.length-1)set(++ti);});})(0);
  const dark=()=>$('map').classList.toggle('dark-map',isDark());dark();document.addEventListener('themechange',dark);
  const zl=()=>$('map').classList.toggle('z-low',map.getZoom()<12);map.on('zoomend',zl);zl();

  allLayer=L.layerGroup();dayLayer=L.layerGroup();legLayer=L.layerGroup().addTo(map);

  Object.values(HOTELS).forEach(h=>{if(!h.tbd)L.marker([h.lat,h.lng],{icon:hotelIcon()}).addTo(allLayer).bindTooltip('🏨 '+h.name,{className:'lbl',direction:'top',offset:[0,-18]});});

  // кнопка «где я»
  const Locate=L.Control.extend({options:{position:'topright'},onAdd(){

    map.on('locationfound',e=>{b.textContent='🎯';setMe(e.latlng.lat,e.latlng.lng);});
    map.on('locationerror',()=>{b.textContent='🚫';setTimeout(()=>b.textContent='🎯',2500);});
    return b;}});
  new Locate().addTo(map);

  // подсказка по значкам
  const Legend=L.Control.extend({options:{position:'bottomleft'},onAdd(){
    const w=L.DomUtil.create('div');L.DomEvent.disableClickPropagation(w);
    const btn=`<button class="map-btn" title="Что значат значки" style="width:auto;padding:0 12px;font-size:15px;font-weight:700">ℹ️ Значки</button>`;

      `<div><span class="d" style="--c:#1c2026;border-radius:6px">🏨</span>Отель</div>`+
      `<div><span class="d" style="--c:#111418;font-weight:800;color:#fff">2</span>Цифра — порядок в дне<br>(в «Все дни» — номер дня)</div>`+
      `<div style="justify-content:flex-end"><button style="font-weight:700;color:var(--accent)">Скрыть</button></div></div>`;
    // на компьютере подсказка раскрыта, на телефоне — свёрнута (чтобы не закрывала карту)
    let open=store.get('legend')?store.get('legend')==='1':!mobile();
    const draw=()=>{w.innerHTML=open?box:btn;w.querySelector('button').onclick=()=>{open=!open;store.set('legend',open?'1':'0');draw();};};

function setMe(lat,lng){if(!map)return;if(myMarker)myMarker.setLatLng([lat,lng]);else myMarker=L.marker([lat,lng],{icon:meIcon(),zIndexOffset:2000}).addTo(map);}

// вписать точки в видимую часть карты (на телефоне — над шторкой)
function sheetH(){if(!mobile()||document.body.dataset.tab!=='map')return 0;const st=$('panel').dataset.state;
  const avail=innerHeight-64;return st==='mini'?170:st==='full'?avail-70:avail*.52;}
function fit(pts,maxZoom){
  if(!map||!pts.length)return;
  map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[40,60],paddingBottomRight:[60,sheetH()+30],maxZoom:pts.length===1?15:(maxZoom||16)});
}
function showAllOnMap(){if(!map)return;dayLayer.clearLayers();legLayer.clearLayers();map.removeLayer(dayLayer);allLayer.addTo(map);
  fit(DAYS.flatMap(d=>d.places.map(s=>[s.lat,s.lng])),9);}
function showDayOnMap(d,sel){
  if(!map)return;

  const start=hotelOf(DAYS[d.n-2]),night=hotelOf(d);
  const line=[...(start?[[start.lat,start.lng]]:[]),...d.places.map(s=>[s.lat,s.lng])];
  L.polyline(line,{color:'#111418',weight:3,opacity:.45,dashArray:'4,8'}).addTo(dayLayer);
  [start,night].forEach(h=>{if(h)L.marker([h.lat,h.lng],{icon:hotelIcon()}).addTo(dayLayer).bindTooltip('🏨 '+h.name,{className:'lbl',direction:'top',offset:[0,-18]});});
  d.places.forEach(s=>L.marker([s.lat,s.lng],{icon:mkIcon(s,s.k,sel===s),zIndexOffset:sel===s?1000:0}).addTo(dayLayer)
    .bindTooltip(s.name,{className:'lbl perm',direction:'top',offset:[0,-24],permanent:true}).on('click',()=>go(`map/d${d.n}-${s.i}`)));
  if(!sel)fit([...line,...(night?[[night.lat,night.lng]]:[])]);
}

// маршрут между точками (OSRM на данных OpenStreetMap: пешком / на машине)
const legCache={};let legToken=0;
async function fetchLeg(a,b,profile){
  const key=[a.lat,a.lng,b.lat,b.lng,profile].join();if(legCache[key])return legCache[key];
  const r=await fetch(`https://routing.openstreetmap.de/routed-${profile}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
  if(!r.ok)throw new Error(r.status);const j=await r.json();if(j.code!=='Ok')throw new Error(j.code);
  const rt=j.routes[0];return legCache[key]={line:rt.geometry.coordinates.map(c=>[c[1],c[0]]),dist:rt.distance,dur:rt.duration};
}
async function showLeg(s,from){
  const box=$('legInfo');if(!box)return;const my=++legToken;
  if(map)legLayer.clearLayers();
  if(!from){box.innerHTML='';fit([[s.lat,s.lng]]);return;}
  const dist=km(from,s),col=cat(s).color;
  if(dist>40){
    box.innerHTML=`<div class="leg"><span class="ic">🚆</span><div>Поезд · ~${Math.round(dist)} км<small>как ехать — написано выше и в Google Maps</small></div></div>`;
    if(map){L.polyline([[from.lat,from.lng],[s.lat,s.lng]],{color:col,weight:4,dashArray:'2,10'}).addTo(legLayer);fit([[from.lat,from.lng],[s.lat,s.lng]]);}
    return;
  }
  const foot=dist<=2.5;
  box.innerHTML=`<div class="leg"><span class="ic">⏳</span><div>Строю маршрут…</div></div>`;
  if(map)fit([[from.lat,from.lng],[s.lat,s.lng]]);
  try{
    const lg=await fetchLeg(from,s,foot?'foot':'car');if(my!==legToken)return;
    box.innerHTML=foot?`<div class="leg"><span class="ic">🚶</span><div>Пешком ${fmtMin(lg.dur)}<small>${fmtKm(lg.dist)} · синяя линия на карте</small></div></div>`
      :`<div class="leg"><span class="ic">🚕</span><div>На такси ~${fmtMin(lg.dur*1.3)}<small>${fmtKm(lg.dist)} · на метро и автобусе — кнопка ниже</small></div></div>`;
    if(map){legLayer.clearLayers();
      L.polyline(lg.line,{color:'#fff',weight:10,opacity:.95}).addTo(legLayer);
      L.polyline(lg.line,{color:foot?'#2a7fff':col,weight:6,dashArray:foot?'1,10':null,lineCap:'round'}).addTo(legLayer);fit(lg.line);}
  }catch(e){if(my!==legToken)return;
    box.innerHTML=`<div class="leg"><span class="ic">📏</span><div>~${dist.toFixed(1).replace('.',',')} км по прямой<small>маршрут не построился (нет интернета?) — откройте Google Maps</small></div></div>`;
    if(map)L.polyline([[from.lat,from.lng],[s.lat,s.lng]],{color:col,weight:4,dashArray:'2,10'}).addTo(legLayer);}
}
function routeFromMe(s){
  const box=$('legInfo');const my=++legToken;
  if(!navigator.geolocation){box.innerHTML=`<div class="leg"><span class="ic">🚫</span><div>Геолокация недоступна<small>нажмите «Маршрут в Google Maps»</small></div></div>`;return;}
  box.innerHTML=`<div class="leg"><span class="ic">📡</span><div>Ищу, где вы…<small>разрешите доступ к местоположению, если телефон спросит</small></div></div>`;
  navigator.geolocation.getCurrentPosition(p=>{if(my!==legToken)return;
    const me={lat:p.coords.latitude,lng:p.coords.longitude};setMe(me.lat,me.lng);
    const dist=km(me,s);
    if(dist>150){if(map)legLayer.clearLayers();
      box.innerHTML=`<div class="leg"><span class="ic">🌏</span><div>Вы пока далеко — ${Math.round(dist).toLocaleString('ru')} км<small>в Японии здесь появится маршрут от вас</small></div></div>`;return;}
    showLeg(s,me);
  },()=>{if(my!==legToken)return;
    box.innerHTML=`<div class="leg"><span class="ic">🚫</span><div>Не удалось определить место<small>разрешите геолокацию в настройках или нажмите «Маршрут в Google Maps»</small></div></div>`;},
  {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

// галочки — сохраняются в браузере
function bindChecks(rowSel,bar,txt,onChange){
  const rows=[...document.querySelectorAll(rowSel)];
  const upd=()=>{const n=rows.filter(r=>r.querySelector('input').checked).length;
    $(bar).style.width=(rows.length?n/rows.length*100:0)+'%';$(txt).textContent=`${n} из ${rows.length}`;onChange&&onChange();};
  rows.forEach(r=>{const b=r.querySelector('input'),key=r.dataset.key;
    b.checked=store.get(key)==='1';r.classList.toggle('done',b.checked);
    b.addEventListener('change',()=>{store.set(key,b.checked?'1':null);r.classList.toggle('done',b.checked);upd();});});
  upd();
}

    <input type="checkbox"><div><div class="t">🎮 ${p.title}</div><div class="w"><span lang="ja">${p.ja}</span> · ${p.model}</div><div class="n">${p.note}</div>
    <div class="n"><b>Проверить:</b><ul>${p.check.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    ${p.ideas?`<div class="n"><b>Идеи без японского:</b> ${p.ideas.join(' · ')}</div>`:''}</div></label>`).join('')+
    `</div><div class="card"><div class="h3">💡 Советы</div><ul class="list">${SHOPPING_TIPS.map(t=>`<li>${t}</li>`).join('')}</ul>`},
  packing:{title:'🧳 Вещи',lead:'Что взять с собой.',html:()=>PACKING.map((g,gi)=>`<div class="h3" style="margin-top:${gi?14:0}px">${g.icon} ${g.title}</div>`+
    g.items.map((t,i)=>`<label class="ck" data-key="pack:${gi}-${i}"><input type="checkbox"><span>${t}</span></label>`).join('')).join('')},
};
function viewLists(sub){
  sub=LISTS[sub]?sub:(store.get('listTab')||'bookings');store.set('listTab',sub);
  const L_=LISTS[sub];
  $('body').innerHTML=`<div class="segtabs">${Object.entries(LISTS).map(([k,v])=>`<button class="${k===sub?'on':''}" onclick="go('lists/${k}')">${v.title}</button>`).join('')}</div>
    <p class="lead">${L_.lead}</p><div class="progress"><span id="lTxt"></span><span class="bar"><i id="lBar"></i></span></div>
    <div class="card">${L_.html()}</div>`;
  bindChecks('#body .ck','lBar','lTxt');
}
// в «Брони» тоже: пункты, связанные с местом маршрута, ведут на карту
function placeByName(re){for(const d of DAYS)for(const s of d.places)if(re.test(s.name))return `map/d${d.n}-${s.i}`;return null;}

// ================= ИНФО =================
function viewInfo(){
  $('body').innerHTML=`<div class="h3" style="margin:4px 2px 10px">🏨 Адреса отелей — показать таксисту</div>`+
    Object.values(HOTELS).map(h=>h.tbd?`<div class="card"><b>❓ ${h.city}</b> · <span class="muted">${h.nights} — отель ещё не выбран</span></div>`
      :`<div class="card"><div class="muted small" style="font-weight:700">${h.city} · ${h.nights}</div><div class="addr" lang="ja">${h.ja||h.addr}</div>
        <div class="muted small">${h.name}<br>${h.addr} · <a href="tel:${h.tel.replace(/\s/g,'')}">${h.tel}</a></div>
        <div class="btns"><a class="btn" href="${gmDir(null,h)}" ${ext}>🧭 Дорога в отель</a></div></div>`).join('')+
    `<div class="h3" style="margin:18px 2px 10px">📖 Шпаргалка</div>`+
    CHEAT.map(c=>`<div class="card"><div class="h3">${c.icon} ${c.title}</div><ul class="list">${c.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')+
    `<p class="lead" style="margin-top:14px">Страница работает без интернета после первого открытия. Добавьте её на главный экран телефона: «Поделиться» → «На экран Домой».</p>`;
}

// ================= НАВИГАЦИЯ (#map/d3-1, #plan, #lists/shopping, #info) =================
const TITLES={map:'Япония',plan:'План по дням',lists:'Списки',info:'Инфо'};
function go(h){if(location.hash.slice(1)===h)render();else location.hash=h;}
let WX=null;
function fillWx(){document.querySelectorAll('.wxslot').forEach(el=>el.innerHTML=wxHtml(DAYS[el.dataset.n-1],WX));}
function render(){
  let h=location.hash.slice(1);
  if(/^d\d/.test(h))h='map/'+h;                       // старые ссылки #d3-1
  const OLD={bookings:'lists/bookings',shopping:'lists/shopping',cheat:'info',hotels:'info',packing:'lists/packing'};
  if(OLD[h])h=OLD[h];
  const [tab0,sub]=h.split('/');const tab=TITLES[tab0]?tab0:'map';
  document.body.dataset.tab=tab;
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('ptitle').textContent=TITLES[tab];
  $('body').scrollTop=0;
  if(tab!=='map'){
    if(map){map.removeLayer(dayLayer);legLayer.clearLayers();allLayer.addTo(map);}
    ({plan:viewPlan,lists:()=>viewLists(sub),info:viewInfo})[tab]();
    fillWx();return;
  }
  const m=(sub||'').match(/^d(\d+)(?:-(\d+))?$/),d=m&&DAYS[+m[1]-1];
  if(!d)viewAll();
  else{const s=m[2]!==undefined?d.stops[+m[2]]:null;
    if($('panel').dataset.state==='mini'||(s&&$('panel').dataset.state==='full'))setSheet('peek');
    if(s&&!s.move)viewStop(d,s);else viewDay(d);}
  fillWx();
}
addEventListener('hashchange',render);
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.t==='map'?(store.get('lastMap')||'map'):b.dataset.t));
addEventListener('hashchange',()=>{if(location.hash.startsWith('#map'))store.set('lastMap',location.hash.slice(1));});

// шторка на телефоне: потянуть вверх/вниз или нажать
const ORDER=['mini','peek','full'];
function setSheet(st){$('panel').dataset.state=st;}
(function(){const g=$('grab');let y0=null;
  g.addEventListener('click',()=>{const i=ORDER.indexOf($('panel').dataset.state);setSheet(ORDER[(i+1)%3]);});
  g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;},{passive:true});
  g.addEventListener('touchend',e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(Math.abs(dy)<25)return;
    const i=ORDER.indexOf($('panel').dataset.state);setSheet(ORDER[Math.max(0,Math.min(2,i+(dy<0?1:-1)))]);e.preventDefault();});})();

// ---------- старт ----------
const until=daysUntilTrip();
$('psub').textContent=today?`Сегодня день ${today.n} из ${DAYS.length} · ${today.city}`:
  until>0?`7–17 октября · через ${until} ${plural(until,'день','дня','дней')}`:'Поездка завершена — おつかれさま!';
bindThemeButton($('themeBtn'));
if(!location.hash&&today)history.replaceState(null,'','#map/d'+today.n);
render();
loadWeather().then(w=>{WX=w;fillWx();});
loadLeaflet(['vendor/leaflet/leaflet.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'],initMap);
</script>
</body>
</html>
